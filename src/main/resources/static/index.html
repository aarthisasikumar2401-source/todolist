<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }

        .container {
            background: white;
            padding: 20px;
            width: 400px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        input {
            width: 70%;
            padding: 8px;
        }

        button {
            padding: 8px 12px;
            cursor: pointer;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        li {
            background: #e9ecef;
            padding: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            border-radius: 5px;
        }

        .delete-btn {
            background: red;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>My To-Do List</h2>

    <input type="text" id="taskInput" placeholder="Enter task">
    <button onclick="addTask()">Add</button>

    <ul id="taskList"></ul>
</div>

<script>

    const apiUrl = "http://localhost:8080/todolist";

    // Load all tasks
    function loadTasks() {
        fetch(apiUrl)
            .then(response => response.json())
            .then(data => {
                const list = document.getElementById("taskList");
                list.innerHTML = "";

                data.forEach(task => {
                    const li = document.createElement("li");

                    li.innerHTML = `
                        ${task.name}
                        <button class="delete-btn" onclick="deleteTask('${task.id}')">X</button>
                    `;

                    list.appendChild(li);
                });
            });
    }

    // Add new task
    function addTask() {
        const input = document.getElementById("taskInput");
        const name = input.value;

        if(name.trim() === "") {
            alert("Task cannot be empty");
            return;
        }

        fetch(apiUrl, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ name: name })
        })
        .then(() => {
            input.value = "";
            loadTasks();
        });
    }

    // Delete task
    function deleteTask(id) {
        fetch(`${apiUrl}/${id}`, {
            method: "DELETE"
        })
        .then(() => loadTasks());
    }

    // Load tasks when page loads
    loadTasks();

</script>

</body>
</html>
